<body><h1>Балканская олимпиада по математике 2010 года | Казахстанские олимпиады</h1><p class="meta">Источник: <a href="https://olympiads.bc-pf.org/math/s/bmo/2010/problem1">https://olympiads.bc-pf.org/math/s/bmo/2010/problem1</a></p>
<article class="tydlqk0"><p>Пусть \(a\), \(b\) и \(c\) — положительные вещественные числа.Докажите неравенство \(\dfrac {a^2b(b-c)}{a+b}+\dfrac {b^2c(c-a)}{b+c}+\dfrac{c^2a(a-b)}{c+a}\ge 0.\)</p></article>
