<body><h1>Шелковый путь олимпиада по математике 2008 года | Казахстанские олимпиады</h1><p class="meta">Источник: <a href="https://olympiads.bc-pf.org/math/s/srmc/2008/problem1">https://olympiads.bc-pf.org/math/s/srmc/2008/problem1</a></p>
<article class="tydlqk0"><p>Пусть натуральные числа \(a,b,c,d\) таковы, что \(d\) делит \(a^{2b}+c\) и \(d \ge a+c\).
Докажите, что \(d \ge a + \sqrt[2b]{a}\).</p></article>
