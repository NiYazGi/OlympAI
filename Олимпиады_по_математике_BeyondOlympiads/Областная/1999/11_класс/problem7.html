<h1>Областная олимпиада по математике 1999 года за 11 класс | Казахстанские олимпиады</h1><div class="source">Источник: <a href="https://olympiads.bc-pf.org/math/oblast/1999/11/problem7">https://olympiads.bc-pf.org/math/oblast/1999/11/problem7</a></div><article class="tydlqk0"><p>В квадрате <span class="math">\(ABCD\)</span> расположена точка <span class="math">\(P\)</span> таким образом, что  <span class="math">\(AP=2\sqrt3\)</span>; <span class="math">\(BP=\sqrt2\)</span>; <span class="math">\(CP=4\)</span>. Докажите, что  <span class="math">\(\angle APC = 120^\circ \)</span>.</p></article></body></html>
